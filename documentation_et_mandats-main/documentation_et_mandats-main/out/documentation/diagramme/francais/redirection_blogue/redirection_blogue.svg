<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="478px" preserveAspectRatio="none" style="width:1507px;height:478px;background:#FFFFFF;" version="1.1" viewBox="0 0 1507 478" width="1507px" zoomAndPan="magnify"><defs/><g><ellipse cx="963" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="224" x="851" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="204" x="861" y="71.6016">Ouvrir la page image-generation-3</text><path d="M464,94.1328 L464,165.375 L821,165.375 L821,104.1328 L811,94.1328 L464,94.1328 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M811,94.1328 L811,104.1328 L821,104.1328 L811,94.1328 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283" x="470" y="111.7012">Si l'utilisateur vient d'un blogue, il n'aura pas</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336" x="470" y="127.0117">d'apporche sauvegard&#233;. Seulement la sous-approche.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320" x="470" y="142.3223">&#199;a permettra de le distinguer d'un utilisateur ayant</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327" x="470" y="157.6328">d&#233;j&#224; pass&#233; &#224; travers le processus de caract&#233;risation.</text><polygon fill="#F1F1F1" points="833,165.375,1093,165.375,1105,177.375,1093,189.375,833,189.375,821,177.375,833,165.375" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="260" x="833" y="181.5322">L'utilisateur a une sous-approche sauvegard&#233;e ?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19" x="802" y="175.0547">Oui</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="22" x="1105" y="175.0547">Non</text><polygon fill="#F1F1F1" points="428.5,199.375,656.5,199.375,668.5,211.375,656.5,223.375,428.5,223.375,416.5,211.375,428.5,199.375" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="228" x="428.5" y="215.5322">L'utilisateur a une approche sauvegard&#233;e ?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19" x="397.5" y="209.0547">Oui</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="22" x="668.5" y="209.0547">Non</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="285" x="11" y="233.375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="265" x="21" y="254.9766">Rediriger vers la page du choix de l'approche</text><polygon fill="#F1F1F1" points="835.5,233.375,1067.5,233.375,1079.5,245.375,1067.5,257.375,835.5,257.375,823.5,245.375,835.5,233.375" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="232" x="835.5" y="249.5322">Le mode de g&#233;n&#233;ration est d&#233;j&#224; enregistr&#233; ?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19" x="804.5" y="243.0547">Oui</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="22" x="1079.5" y="243.0547">Non</text><path d="M306,267.375 L306,323.3066 A0,0 0 0 0 306,323.3066 L651,323.3066 A0,0 0 0 0 651,323.3066 L651,299.3408 L671,295.3408 L651,291.3408 L651,277.375 L641,267.375 L306,267.375 A0,0 0 0 0 306,267.375 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M641,267.375 L641,277.375 L651,277.375 L641,267.375 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265" x="312" y="284.9434">On redirige vers le choix de l'approche car</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265" x="312" y="300.2539">l'utilisateur a d&#233;j&#224; pass&#233; une fois &#224; travers</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324" x="312" y="315.5645">le processus et pourrait vouloir changer d'approche</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="285" x="671" y="278.2744"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="265" x="681" y="299.876">Rediriger vers la page du choix de l'approche</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="223" x="978" y="267.375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="203" x="988" y="288.9766">Rediriger vers image-generation-2</text><ellipse cx="1089.5" cy="347.5078" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="1089.5" cy="347.5078" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#F1F1F1" points="542.5,368.5078,554.5,380.5078,542.5,392.5078,530.5,380.5078,542.5,368.5078" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="285" x="1211" y="199.375"/><text fill="#000000" font-family="sans-serif" font-s